<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bubble</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <section id="panel">
      <header id="panel-head">
        <span id="panel-title">All caught up</span>
      </header>
      <ul id="list"></ul>
      <div id="empty">🎉 Nothing waiting</div>
      <footer id="panel-foot">
        <button id="lang" class="mini" title="Language / 语言"></button>
        <button id="clear">Clear</button>
        <button id="quit" title="Quit bubble">Quit</button>
      </footer>
    </section>

    <div id="ball" title="AI tasks · click to view">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
        <path fill="currentColor" d="M12 2a1 1 0 0 1 1 1v1.06A7 7 0 0 1 19 11v4l1.4 2.1A1 1 0 0 1 19.6 19H4.4a1 1 0 0 1-.83-1.55L5 15v-4a7 7 0 0 1 6-6.94V3a1 1 0 0 1 1-1Zm-2.5 8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm5 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3ZM10 20h4a2 2 0 1 1-4 0Z"/>
      </svg>
      <span id="badge">0</span>
    </div>
  </body>
</html>
